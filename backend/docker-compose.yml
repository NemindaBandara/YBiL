services:
  postgres:
    image: postgres:16-alpine
    container_name: ybil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ybil_db
      POSTGRES_USER: ybil_user
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local